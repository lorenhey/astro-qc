[project]
name = "astro-qc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astropy>=8.0.1",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "photutils>=3.0.0",
    "pydantic>=2.13.5",
    "rich>=15.0.0",
    "scipy>=1.18.1",
    "streamlit>=1.63.0",
    "typer>=0.27.2",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[project.scripts]
astro-qc = "astro_qc.cli.main:app"

